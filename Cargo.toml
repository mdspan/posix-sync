[package]
name = "posix-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.65"
description = "Idiomatic Rust interface for POSIX synchronisation primitives."
license = "MIT"
repository = "https://github.com/mdspan/posix-sync"
readme = "README.md"
documentation = "https://docs.rs/posix-sync"
keywords = ["pthread", "posix", "mutex", "robust", "shared-memory"]
categories = ["concurrency", "api-bindings", "os::unix-apis"]

# Nine things in this crate differ between platforms, so documenting a single target would describe
# an API that macOS, BSD and musl users do not have. Naming the targets explicitly is what makes
# docs.rs render the rest of them. musl earns a slot of its own because it is the only one of these
# that differs from another target sharing its operating system.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-freebsd",
    "x86_64-unknown-netbsd",
]
# Turns on `doc(cfg(...))`, which labels those items with the platforms they exist on.
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "posix_sync"

[dependencies]
# 0.2.187 is the first release to give DragonFly's `pthread_barrierattr_t` its real, pointer-sized
# type. Earlier ones make it a `c_int`, which `pthread_barrierattr_init` overruns.
libc = "0.2.187"

[dev-dependencies]
anyhow = "1.0.89"
# The doc examples put locks into mapped memory without hand-rolling an mmap wrapper. tempfile's
# default getrandom feature is switched off because its current release needs a newer Rust than
# this crate checks against.
memmap2 = "0.9.11"
tempfile = { version = "3.27.0", default-features = false }
